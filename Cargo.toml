[workspace]
resolver = "2"
members = [
    "crates/cx-protocol",
    "crates/cx-crypto",
    "crates/cx-plugin",
    "crates/cx-tunnel",
    "crates/cx-server",
    "crates/cx-cli",
]

[workspace.package]
version = "0.1.0-alpha.3"
edition = "2024"
repository = "https://github.com/reonokiy/cx"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[workspace.dependencies]
# Internal crates
cx-protocol = { path = "crates/cx-protocol" }
cx-crypto = { path = "crates/cx-crypto" }
cx-plugin = { path = "crates/cx-plugin" }
cx-tunnel = { path = "crates/cx-tunnel" }

# Async & core
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Networking, HTTP & QUIC
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
axum = "0.8"
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rustls-native-certs = "0.8"
webpki-roots = "0.26"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "rustls-tls-native-roots"] }

# Crypto & auth
rcgen = "0.13"
moka = { version = "0.12", features = ["sync"] }
arc-swap = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
aes-gcm = "0.10"
sha2 = "0.10"
subtle = "2"
base64 = "0.22"
rand = "0.8"
secrecy = "0.10"
zeroize = "1"
jsonwebtoken = "9"

# Policy, plugins & storage
globset = "0.4"
ipnet = "2"
psl = "2"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-native-roots", "postgres", "macros", "migrate", "json", "chrono", "uuid"] }

# Linux NetNS & userspace stack
smoltcp = { version = "0.12", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "socket-tcp", "socket-udp"] }
nix = { version = "0.29", features = ["sched", "mount", "socket", "user", "ioctl", "process", "signal", "fs"] }
libc = "0.2"

# CLI
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
